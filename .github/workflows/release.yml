name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed stable version already committed in package.json and CHANGELOG.md
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: scenarios-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SCENARIOS_PACKAGE_OUTPUT_DIR: /tmp/scenarios-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm test:browser --repeat-each=3
      - run: node scripts/release/release.ts prepare "$SCENARIOS_PACKAGE_OUTPUT_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenarios-release
          path: /tmp/scenarios-release/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SCENARIOS_PACKAGE_OUTPUT_DIR: /tmp/scenarios-release
      NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scenarios-release
          path: /tmp/scenarios-release
      - run: node scripts/release/release.ts publish "$SCENARIOS_PACKAGE_OUTPUT_DIR"
      - run: node scripts/release/release.ts finish "$SCENARIOS_PACKAGE_OUTPUT_DIR"
        env:
          GH_TOKEN: ${{ github.token }}
